spring.application.name=j2j-bot

# VK API token (Community token with messages access)
vk.token=${VK_TOKEN:}

# DeepSeek API
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.api.url=https://api.deepseek.com/v1/chat/completions
deepseek.model=deepseek-chat
deepseek.temperature=0.2

# Admin VK user IDs (comma-separated)
admin.ids=${ADMIN_IDS:}

# Knowledge base root directory
knowledge.root=${KNOWLEDGE_ROOT:/app/shared/Литература}

# Vector store persistence file
vector.store.path=${VECTOR_STORE_PATH:./data/vector_store.json}

# SQLite database path
sqlite.db.path=${SQLITE_DB_PATH:./data/j2j_bot.db}

# Static files (robot images)
static.dir=${STATIC_DIR:./static}

# RAG settings
rag.max.results=5
rag.min.score=0.4

# Server port (not used for long polling bot, but needed for health check)
server.port=${PORT:8080}

# Logging
logging.level.com.j2j=INFO
logging.level.dev.langchain4j=WARN
logging.level.org.apache.pdfbox=WARN
